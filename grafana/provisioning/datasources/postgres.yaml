# Module 5-3 — conversation_logs (same DB the Streamlit app writes to).
# Defaults: local pra-postgres via host.docker.internal:5435.
# Neon/Supabase: set PRA_PG_* in docker-compose / .env (see README Cloud + Neon).
apiVersion: 1

# Force recreate so URL/user/password actually update (Grafana often keeps old secureJsonData).
deleteDatasources:
  - name: PRA Postgres
    orgId: 1

datasources:
  - name: PRA Postgres
    type: postgres
    uid: pra-postgres
    access: proxy
    # Grafana expands $ENV vars from the container environment.
    url: $PRA_PG_HOST
    user: $PRA_PG_USER
    secureJsonData:
      password: $PRA_PG_PASSWORD
    jsonData:
      database: $PRA_PG_DB
      sslmode: $PRA_PG_SSLMODE
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: true
    version: 3
