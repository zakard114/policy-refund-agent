[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-refund-agent"
version = "0.1.0"
description = "Policy & Refund Support Agent — grounded RAG for e-commerce refund policy Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "minsearch>=0.0.11,<0.1",
    "streamlit>=1.32",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
pra-check-llm = "app.check_llm:main"
pra-ask = "app.main:main"
pra-streamlit = "app.entrypoints:streamlit_main"
pra-api = "app.entrypoints:api_main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
# Do not set cache-dir here — Streamlit Community Cloud runs `uv sync` when
# uv.lock is present, and a host-relative cache path breaks the cloud install.
# Local: set UV_CACHE_DIR via scripts/use_e_drive.ps1 instead.
